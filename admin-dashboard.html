<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ครู - FixItForward</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f1f5f9; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; color: #1e293b; }
        .page { max-width: 1280px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.03); }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2.5rem; background: white; border-bottom: 1px solid #e2edf2; flex-wrap: wrap; gap: 1rem; }
        .logo-area h1 { font-family: 'Kanit', sans-serif; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #1E3A8A, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area span { font-size: 14px; color: #4b5563; display: block; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #1f2a44; transition: 0.2s; }
        .nav-links a:hover { color: #2563eb; }
        .btn-home { background: #eef2ff; padding: 0.5rem 1.2rem; border-radius: 40px; color: #1e3a8a; }

        .dashboard-header { background: linear-gradient(115deg, #dbeafe 0%, #ffffff 80%); padding: 2rem 2.5rem; text-align: center; border-bottom: 1px solid #93c5fd; }
        .dashboard-header h2 { font-family: 'Kanit', sans-serif; font-size: 2.3rem; font-weight: 700; color: #1e293b; }
        .dashboard-header h2 i { color: #3b82f6; margin-right: 12px; }
        .dashboard-header p { max-width: 600px; margin: 0.8rem auto 0; color: #475569; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; padding: 2rem 2.5rem; }
        .stat-card { background: white; border-radius: 20px; padding: 1.5rem; text-align: center; box-shadow: 0 10px 25px -12px rgba(0,0,0,0.08); border: 1px solid #e9ecef; }
        .stat-card .number { font-family: 'Kanit', sans-serif; font-size: 2.8rem; font-weight: 800; color: #1e3a8a; }
        .stat-card .label { font-size: 0.9rem; color: #6b7280; margin-top: 0.2rem; }
        .stat-card.emergency .number { color: #dc2626; }
        .stat-card.fixed .number { color: #10b981; }
        .stat-card.pending .number { color: #f59e0b; }

        .filter-section { padding: 0 2.5rem 1.5rem 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .filter-section input, .filter-section select { padding: 0.6rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 40px; font-family: inherit; font-size: 0.9rem; transition: 0.2s; background: white; }
        .filter-section input:focus, .filter-section select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .filter-section input { flex: 1; min-width: 200px; }
        .btn-clear { padding: 0.6rem 1.2rem; border: 1px solid #e2e8f0; border-radius: 40px; background: white; cursor: pointer; }

        .table-container { padding: 0 2.5rem 2.5rem 2.5rem; overflow-x: auto; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .report-table th { background: #f8fafc; text-align: left; padding: 0.8rem 1rem; font-weight: 600; color: #475569; border-bottom: 2px solid #e2edf2; }
        .report-table td { padding: 0.8rem 1rem; border-bottom: 1px solid #eef2ff; vertical-align: middle; }
        .report-table tr:hover td { background: #f8fafc; }

        .badge-status { display: inline-block; padding: 0.25rem 0.8rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-reviewing { background: #dbeafe; color: #1e40af; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-in_progress { background: #fef3c7; color: #92400e; }
        .badge-completed { background: #a7f3d0; color: #065f46; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }

        .badge-urgency { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .urgency-normal { background: #dcfce7; color: #15803d; }
        .urgency-urgent { background: #fef9c3; color: #854d0e; }
        .urgency-emergency { background: #fee2e2; color: #991b1b; }

        .btn-action { padding: 0.3rem 0.8rem; border: none; border-radius: 40px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn-action:hover { transform: translateY(-1px); }
        .btn-complete { background: #10b981; color: white; }
        .btn-complete:hover { background: #059669; }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-delete:hover { background: #fecaca; }

        .empty-state { text-align: center; padding: 3rem; color: #6c757d; }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem; }
        .contact-bar { background: #f8fafc; padding: 1rem 2.5rem; text-align: center; border-top: 1px solid #e2edf2; font-size: 0.85rem; color: #4b5563; }

        @media (max-width: 750px) {
            .navbar { flex-direction: column; text-align: center; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-section { flex-direction: column; }
            .filter-section input { width: 100%; }
            .report-table { font-size: 0.75rem; }
            .report-table th, .report-table td { padding: 0.5rem; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="navbar">
        <div class="logo-area"><h1>FIXITFORWARD</h1><span>Dashboard ครู</span></div>
        <div class="nav-links">
            <a href="index.html" class="btn-home"><i class="fas fa-home"></i> หน้าแรก</a>
        </div>
    </div>

    <div class="dashboard-header">
        <h2><i class="fas fa-chart-pie"></i> แผงควบคุมครู</h2>
        <p>ดูภาพรวม จัดการ และอัปเดตสถานะรายงานปัญหาทั้งหมด</p>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">📋 รายงานทั้งหมด</div></div>
        <div class="stat-card emergency"><div class="number" id="statEmergency">0</div><div class="label">🚨 ฉุกเฉิน</div></div>
        <div class="stat-card pending"><div class="number" id="statPending">0</div><div class="label">⏳ รอดำเนินการ</div></div>
        <div class="stat-card fixed"><div class="number" id="statCompleted">0</div><div class="label">✅ สำเร็จแล้ว</div></div>
    </div>

    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="🔍 ค้นหา... (ชื่อ, สถานที่, รายละเอียด)">
        <select id="filterStatus">
            <option value="all">📌 สถานะทั้งหมด</option>
            <option value="pending">รอตรวจสอบ</option>
            <option value="reviewing">กำลังตรวจสอบ</option>
            <option value="approved">อนุมัติแล้ว</option>
            <option value="in_progress">กำลังดำเนินการ</option>
            <option value="completed">สำเร็จแล้ว</option>
            <option value="rejected">ไม่สามารถดำเนินการได้</option>
        </select>
        <select id="filterUrgency">
            <option value="all">🚩 ทุกระดับ</option>
            <option value="ปกติ">ปกติ</option>
            <option value="ด่วน">ด่วน</option>
            <option value="ฉุกเฉิน">ฉุกเฉิน</option>
        </select>
        <button class="btn-clear" id="clearFiltersBtn">✕ ล้างตัวกรอง</button>
    </div>

    <div class="table-container">
        <div id="tableWrapper"><div class="empty-state"><i class="fas fa-inbox"></i><p>ยังไม่มีรายงานปัญหา</p></div></div>
    </div>

    <div class="contact-bar">
        <i class="fas fa-envelope"></i> fixitforward.pkw@gmail.com | <i class="fas fa-school"></i> โรงเรียนภูเก็ตวิทยาลัย
    </div>
</div>

<script>
    // ===== โหลดข้อมูล =====
    function loadReports() {
        let reports = localStorage.getItem('fixitforward_reports');
        if (reports) {
            return JSON.parse(reports);
        } else {
            // ข้อมูลตัวอย่าง
            const defaultData = [
                { id: 'FIF-2025-001', timestamp: '15/01/2568 10:30', reporter: 'สมชาย', category: 'อุปกรณ์ชำรุด', location: 'สนามบาส', description: 'ตะกร้าแตกร้าว', email: 'somchai@school.ac.th', urgency: 'ฉุกเฉิน', status: 'in_progress', admin_notes: 'สั่งซ่อมแล้ว' },
                { id: 'FIF-2025-002', timestamp: '16/01/2568 09:15', reporter: 'มานี', category: 'ความปลอดภัย', location: 'อาคาร 3', description: 'ไฟดับ', email: 'mani@school.ac.th', urgency: 'ด่วน', status: 'completed', admin_notes: 'เปลี่ยนหลอดไฟแล้ว' }
            ];
            localStorage.setItem('fixitforward_reports', JSON.stringify(defaultData));
            return defaultData;
        }
    }

    let reports = loadReports();

    function saveReports(data) { localStorage.setItem('fixitforward_reports', JSON.stringify(data)); }

    function getStatusThai(s) {
        const map = { 'pending':'รอตรวจสอบ', 'reviewing':'กำลังตรวจสอบ', 'approved':'อนุมัติแล้ว', 'in_progress':'กำลังดำเนินการ', 'completed':'สำเร็จแล้ว', 'rejected':'ไม่สามารถดำเนินการได้' };
        return map[s] || s;
    }

    function getStatusClass(s) { return 'badge-' + s; }

    // ===== AUTO UPDATE FIXED COUNT =====
    function autoUpdateFixedCount() {
        try {
            const completed = reports.filter(r => r.status === 'completed').length;
            localStorage.setItem('fixitforward_fixed_reports', completed);
            console.log(`✅ อัปเดต "แก้ไขสำเร็จ" อัตโนมัติ: ${completed} เรื่อง`);
        } catch (e) { console.log('⚠️ ไม่สามารถอัปเดตตัวเลขอัตโนมัติ:', e); }
    }

    // ===== แสดงตาราง =====
    function renderTable(filtered) {
        const wrapper = document.getElementById('tableWrapper');
        if (!filtered || filtered.length === 0) {
            wrapper.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>ไม่พบรายงานที่ค้นหา</p></div>`;
            return;
        }
        let html = `<table class="report-table"><thead><tr><th>รหัส</th><th>วันที่</th><th>ผู้แจ้ง</th><th>ประเภท</th><th>สถานที่</th><th>ความเร่งด่วน</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody>`;
        filtered.forEach(r => {
            html += `<tr>
                <td><strong>${r.id}</strong></td>
                <td>${r.timestamp}</td>
                <td>${r.reporter}</td>
                <td>${r.category}</td>
                <td>${r.location}</td>
                <td><span class="badge-urgency urgency-${r.urgency === 'ฉุกเฉิน' ? 'emergency' : r.urgency === 'ด่วน' ? 'urgent' : 'normal'}">${r.urgency}</span></td>
                <td><span class="badge-status ${getStatusClass(r.status)}">${getStatusThai(r.status)}</span></td>
                <td>
                    <div style="display:flex; gap:0.3rem; flex-wrap:wrap;">
                        ${r.status !== 'completed' ? `<button class="btn-action btn-complete" onclick="markComplete('${r.id}')">✅ เสร็จ</button>` : ''}
                        <button class="btn-action btn-delete" onclick="deleteReport('${r.id}')">🗑️ ลบ</button>
                        ${r.status !== 'reviewing' && r.status !== 'in_progress' ? `<button class="btn-action" style="background:#dbeafe;color:#1e40af;" onclick="changeStatus('${r.id}','reviewing')">🔍 ตรวจสอบ</button>` : ''}
                        ${r.status !== 'in_progress' && r.status !== 'completed' ? `<button class="btn-action" style="background:#fef3c7;color:#92400e;" onclick="changeStatus('${r.id}','in_progress')">🔧 กำลังทำ</button>` : ''}
                    </div>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        wrapper.innerHTML = html;
    }

    // ===== เปลี่ยนสถานะ =====
    window.changeStatus = function(id, newStatus) {
        const report = reports.find(r => r.id === id);
        if (!report) return;
        report.status = newStatus;
        report.status_updated = new Date().toLocaleString('th-TH');
        saveReports(reports);
        applyFilters();
        updateStats();
        autoUpdateFixedCount(); // ✅ อัปเดตตัวเลขอัตโนมัติ
    };

    window.markComplete = function(id) {
        if (confirm('✅ ยืนยันว่ารายงานนี้แก้ไขเสร็จแล้ว?')) {
            changeStatus(id, 'completed');
        }
    };

    window.deleteReport = function(id) {
        if (confirm('🗑️ คุณแน่ใจว่าต้องการลบรายงานนี้?')) {
            reports = reports.filter(r => r.id !== id);
            saveReports(reports);
            applyFilters();
            updateStats();
            autoUpdateFixedCount(); // ✅ อัปเดตตัวเลขอัตโนมัติ
        }
    };

    // ===== ตัวกรอง =====
    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('filterStatus').value;
        const urgency = document.getElementById('filterUrgency').value;
        let filtered = reports.filter(r => {
            const matchSearch = r.reporter.toLowerCase().includes(search) || r.location.toLowerCase().includes(search) || r.description.toLowerCase().includes(search) || r.id.toLowerCase().includes(search);
            const matchStatus = status === 'all' || r.status === status;
            const matchUrgency = urgency === 'all' || r.urgency === urgency;
            return matchSearch && matchStatus && matchUrgency;
        });
        filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        renderTable(filtered);
    }

    function updateStats() {
        const total = reports.length;
        const emergency = reports.filter(r => r.urgency === 'ฉุกเฉิน').length;
        const pending = reports.filter(r => r.status === 'pending' || r.status === 'reviewing').length;
        const completed = reports.filter(r => r.status === 'completed').length;
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statEmergency').textContent = emergency;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statCompleted').textContent = completed;
        localStorage.setItem('fixitforward_total_reports', total);
        localStorage.setItem('fixitforward_emergency_reports', emergency);
        localStorage.setItem('fixitforward_fixed_reports', completed);
    }

    // ===== Event Listeners =====
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    document.getElementById('filterUrgency').addEventListener('change', applyFilters);
    document.getElementById('clearFiltersBtn').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('filterStatus').value = 'all';
        document.getElementById('filterUrgency').value = 'all';
        applyFilters();
    });

    // ===== เริ่มต้น =====
    updateStats();
    applyFilters();
    autoUpdateFixedCount();

    // ✅ ตรวจสอบทุก 5 วินาที (เผื่อมีการเปลี่ยนแปลงจากที่อื่น)
    setInterval(() => {
        reports = loadReports();
        updateStats();
        applyFilters();
        autoUpdateFixedCount();
    }, 5000);
</script>
</body>
</html>
